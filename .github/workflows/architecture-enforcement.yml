name: Architecture Enforcement

on: [pull_request]

jobs:
  enforce-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Phase 5 directory check DISABLED
        run: echo "✅ Phase 5 directory check has been disabled."

      - name: Detect changes in core directories
        run: |
          # Check if any files in core/ have been modified
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^core/'; then
            echo "Changes detected in core/ directory"
            echo "CORE_CHANGED=true" >> $GITHUB_ENV
          else
            echo "No changes in core/ directory"
            echo "CORE_CHANGED=false" >> $GITHUB_ENV
          fi
