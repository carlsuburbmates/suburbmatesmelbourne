name: Architecture Enforcement

on:
  pull_request:
    branches:
      - main

jobs:
  check-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Phase 5 directory check disabled
        run: echo "✅ Phase 5 directory check disabled for this PR."

      - name: Check for archived Phase 4 modifications
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          PHASE_4_CHANGES=$(echo "$CHANGED_FILES" | grep "^phase-4-modular-monolith/" || true)
          
          if [ -n "$PHASE_4_CHANGES" ]; then
            echo "❌ Error: Files in archived Phase 4 directory were modified:"
            echo "$PHASE_4_CHANGES"
            echo ""
            echo "Phase 4 is archived. Please make changes in the appropriate phase-5-* directory instead."
            exit 1
          fi
          
          echo "✅ No archived Phase 4 files were modified"

      - name: Check for archived Phase 3 modifications
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          PHASE_3_CHANGES=$(echo "$CHANGED_FILES" | grep "^phase-3-soa/" || true)
          
          if [ -n "$PHASE_3_CHANGES" ]; then
            echo "❌ Error: Files in archived Phase 3 directory were modified:"
            echo "$PHASE_3_CHANGES"
            echo ""
            echo "Phase 3 is archived. Please make changes in the appropriate phase-5-* directory instead."
            exit 1
          fi
          
          echo "✅ No archived Phase 3 files were modified"

      - name: Check for archived Phase 2 modifications
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          PHASE_2_CHANGES=$(echo "$CHANGED_FILES" | grep "^phase-2-microservices/" || true)
          
          if [ -n "$PHASE_2_CHANGES" ]; then
            echo "❌ Error: Files in archived Phase 2 directory were modified:"
            echo "$PHASE_2_CHANGES"
            echo ""
            echo "Phase 2 is archived. Please make changes in the appropriate phase-5-* directory instead."
            exit 1
          fi
          
          echo "✅ No archived Phase 2 files were modified"
